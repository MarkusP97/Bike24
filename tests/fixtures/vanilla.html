<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Checkout-Testseite</title>
<style>body{font-family:sans-serif} li{padding:6px;list-style:none} .is-hidden{display:none} [data-state=off]{display:none} .d-none{display:none!important}</style></head><body>
<header>Logos: PayPal Klarna Visa Rechnung</header>
<main>
<h2>Lieferadresse</h2>
<label><input type="radio" name="billingAddressSame" value="yes" checked> Rechnungsadresse = Lieferadresse</label>
<h2>Versand</h2>
<label><input type="radio" name="shipping" value="cod"> Versand per Nachnahme</label>
<p>Gesamtsumme: <span id="sum"></span></p><p id="cnt"></p>
<select name="country"><option selected>Deutschland</option><option>Österreich</option></select>
<h2>Zahlungsart</h2>
<ul id="pm">
 <li id="pp"><label><input type="radio" name="paymentMethod" value="paypal"> PayPal</label></li>
 <li id="inv"><label><input type="radio" name="paymentMethod" value="invoice"> Kauf auf Rechnung</label></li>
 <li id="pre"><label><input type="radio" name="paymentMethod" value="prepayment"> Vorkasse (Versand nach Zahlungseingang)</label></li>
 <li id="cc"><label><input type="radio" name="paymentMethod" value="creditcard"> Kreditkarte</label></li>
 <li id="ap"><label><input type="radio" name="paymentMethod" value="applepay"> Apple Pay</label></li>
 <li id="dd"><label><input type="radio" name="paymentMethod" value="sepa"> SEPA-Lastschrift</label></li>
 <li id="kl"><label><input type="radio" name="paymentMethod" value="klarna"> Klarna Ratenkauf</label></li>
 <li id="gp"><label><input type="radio" name="paymentMethod" value="giropay"> giropay</label></li>
 <li id="gg"><label><input type="radio" name="paymentMethod" value="googlepay"> Google Pay</label></li>
</ul></main>
<footer>Sichere Zahlung mit PayPal, Kauf auf Rechnung, Vorkasse, Kreditkarte</footer>
<script>
const multi = !location.search.includes('single');
document.getElementById('sum').textContent = multi ? '412,97 €' : '89,99 €';
document.getElementById('cnt').textContent = (multi ? 3 : 1) + ' Artikel im Warenkorb';
if (multi) setTimeout(async function applyPaymentRules() {
  const r = await fetch('/api/payment-methods'); await r.json();
  document.getElementById('inv').classList.add('is-hidden');                  // CSS-Klasse
  document.getElementById('pre').remove();                                    // DOM-Knoten entfernt
  document.getElementById('cc').style.display = 'none';                       // Inline-Style
  document.querySelector('#ap input').disabled = true;                        // deaktiviert
  document.getElementById('dd').hidden = true;                                // hidden-Attribut
  document.getElementById('kl').style.setProperty('opacity', '0');            // opacity
  document.getElementById('gp').setAttribute('style', 'visibility:hidden');   // visibility per setAttribute
  document.getElementById('gg').dataset.state = 'off';                        // data-Attribut + CSS-Regel
}, 500);
</script></body></html>
