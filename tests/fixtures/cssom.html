<header>Logos: PayPal Klarna Visa Rechnung</header>
<style id="s2">.pm{padding:10px;border:1px solid #ccc}</style>

<script>
setTimeout(function cssTricks() {
  document.getElementById('s2').sheet.insertRule('.pm-inv{display:none}', 0);             // CSSOM: keine DOM-Änderung!

  const st = document.createElement('style'); st.textContent = '#gp{display:none}';
  document.head.appendChild(st);                                                          // neues <style>
}, 500);
</script>
